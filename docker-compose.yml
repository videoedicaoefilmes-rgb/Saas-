# Ambiente local completo: PostgreSQL, Redis, SeaweedFS (armazenamento compatível com S3),
# migrações, aplicação web e worker.
# Uso: cp .env.example .env  (troque os segredos)  &&  docker compose up --build
# Aplicação: http://localhost:3000 · S3 local: http://localhost:8333
#
# Por que SeaweedFS e não MinIO: as imagens do MinIO deixaram de ser publicadas no Docker Hub.
# As credenciais abaixo são só para uso local (docker/seaweedfs-s3.json).

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://gmclips:gmclips@postgres:5432/gm_clips
    REDIS_URL: redis://redis:6379
    STORAGE_DRIVER: s3
    S3_ENDPOINT: http://s3:8333
    S3_PUBLIC_ENDPOINT: http://localhost:8333
    S3_BUCKET: gm-clips
    S3_ACCESS_KEY_ID: gmclips-local
    S3_SECRET_ACCESS_KEY: gmclips-local-secret
    S3_FORCE_PATH_STYLE: "true"
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    s3-init: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: gmclips, POSTGRES_PASSWORD: gmclips, POSTGRES_DB: gm_clips }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U gmclips -d gm_clips"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  # Armazenamento compatível com S3 (bucket privado: exige as credenciais acima).
  # Volumes internos de 1 GB e quantidade automática conforme o disco livre
  # (os padrões do SeaweedFS são pensados para servidores grandes e esgotam rápido).
  s3:
    image: chrislusf/seaweedfs:4.01
    command: >
      server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -s3.allowedOrigins=http://localhost:3000
      -master.volumeSizeLimitMB=1024 -volume.max=0
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      retries: 20

  # Cria o bucket do projeto (idempotente).
  s3-init:
    image: chrislusf/seaweedfs:4.01
    depends_on: { s3: { condition: service_healthy } }
    # Tenta até o servidor estar pronto; falha de forma visível se não conseguir em ~2 minutos.
    entrypoint:
      - /bin/sh
      - -c
      - |
        for i in $$(seq 1 60); do
          echo 's3.bucket.create -name gm-clips' | weed shell -master=s3:9333 > /tmp/out 2>&1
          if echo 's3.bucket.list' | weed shell -master=s3:9333 2>/dev/null | grep -q gm-clips; then
            echo "bucket gm-clips pronto"; exit 0
          fi
          sleep 2
        done
        cat /tmp/out; echo "ERRO: não foi possível criar o bucket gm-clips"; exit 1
    restart: "no"

  migrate:
    <<: *app
    command: ["pnpm", "db:deploy"]
    restart: "no"

  web:
    <<: *app
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["pnpm", "worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Isolamento do processamento: limites de CPU, memória e disco temporário.
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
    tmpfs: ["/tmp:size=4g"]

volumes:
  pgdata:
  redisdata:
  s3data:

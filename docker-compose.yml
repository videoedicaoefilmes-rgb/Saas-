# Ambiente local completo: PostgreSQL, Redis, MinIO (S3), migrações, web e worker.
# Uso: cp .env.example .env  (troque os segredos)  &&  docker compose up --build
# Web: http://localhost:3000 · Console MinIO: http://localhost:9001 (minioadmin/minioadmin)
#
# ATENÇÃO: este arquivo ainda NÃO foi executado — o ambiente onde o código foi escrito
# não permite Docker. Ver docs/PROGRESS.md (pendências).

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://gmclips:gmclips@postgres:5432/gm_clips
    REDIS_URL: redis://redis:6379
    STORAGE_DRIVER: s3
    S3_ENDPOINT: http://minio:9000
    S3_PUBLIC_ENDPOINT: http://localhost:9000
    S3_BUCKET: gm-clips
    S3_ACCESS_KEY_ID: minioadmin
    S3_SECRET_ACCESS_KEY: minioadmin
    S3_FORCE_PATH_STYLE: "true"
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: gmclips, POSTGRES_PASSWORD: gmclips, POSTGRES_DB: gm_clips }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U gmclips"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, retries: 10 }

  # Cria o bucket PRIVADO (sem acesso anônimo).
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/gm-clips &&
      mc anonymous set none local/gm-clips"

  migrate:
    <<: *app
    command: ["pnpm", "db:deploy"]
    restart: "no"

  web:
    <<: *app
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["pnpm", "worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Isolamento do processamento: limites de CPU, memória e disco temporário.
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
    tmpfs: ["/tmp:size=4g"]

volumes:
  pgdata:
  redisdata:
  miniodata:
